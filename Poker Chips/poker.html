<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
<head>
  <meta charset="UTF-8">
  <title>Poker Chips</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden; /* prevent scrolling */
      font-family: Arial, sans-serif;
    }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center; /* centers container vertically & horizontally */
    }
    
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; /* vertical centering inside container */
      padding: 20px;
      box-sizing: border-box;
    }
    
    .player-row {
      margin-bottom: 5px;
    }
    
    input[type="text"], input[type="number"] {
      padding: 5px;
      margin-right: 5px;
    }
    
    button {
      padding: 5px 10px;
      margin: 5px;
    }
    
    #player-buttons {
      display: flex;
      gap: 10px; /* space between + and - */
      margin-bottom: 10px;
    }
    
    #error {
      color: red;
      margin-top: 10px;
    }
    
    #modeBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 15px;
      background-color: #585858;
      color: white;
      border: none;
      cursor: pointer;
    }
    </style>
    
</head>
<body>
  <div class="container">
    <h1>Poker Chips</h1>

    <div id="players"></div>

    <div id="player-buttons">
      <button id="addPlayer">+</button>
      <button id="removePlayer">-</button>
    </div>

    <input type="number" id="chips" placeholder="Chips" min="1" max="10000">
    <button id="playBtn" style="background: green; color: white;">Play</button>

    <div id="error"></div>
  </div>

  <button id="modeBtn">Desktop</button>

  <script>
    const playersDiv = document.getElementById("players");
    const addBtn = document.getElementById("addPlayer");
    const removeBtn = document.getElementById("removePlayer");
    const playBtn = document.getElementById("playBtn");
    const chipsInput = document.getElementById("chips");
    const errorDiv = document.getElementById("error");
    const modeBtn = document.getElementById("modeBtn");
  
    let gameMode = "Desktop"; // default mode
  
    function addPlayer() {
      const row = document.createElement("div");
      row.classList.add("player-row");
  
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = "Player Name";
  
      row.appendChild(input);
      playersDiv.appendChild(row);
    }
  
    function removePlayer() {
      if (playersDiv.lastElementChild) {
        playersDiv.removeChild(playersDiv.lastElementChild);
      }
    }
  
    function startTabletopMode() {
      window.location.href = "tabletop.html";
    }
  
    function validateAndPlay() {
      const playerInputs = Array.from(document.querySelectorAll("#players input[type='text']"));
      const validPlayers = playerInputs.map(input => input.value.trim()).filter(name => name.length > 0);
  
      if (validPlayers.length < 2) {
        errorDiv.textContent = "Not enough players (2 minimum).";
        return;
      }
  
      const chips = parseInt(chipsInput.value);
      if (!chips || chips < 1 || chips > 10000) {
        errorDiv.textContent = "Please enter a starting chip balance from 1-10000.";
        return;
      }
  
      // Save players and starting chips in localStorage
      const playersData = validPlayers.map(name => ({ name, chips }));
      localStorage.setItem("startingChips", chips);
      localStorage.setItem("players", JSON.stringify(playersData));

      // ✅ Save mode here
      localStorage.setItem("gameMode", gameMode);
  
      startTabletopMode();
    }
  
    function toggleMode() {
      gameMode = gameMode === "Desktop" ? "Tabletop Touch" : "Desktop";
      modeBtn.textContent = gameMode;
    }
  
    addBtn.addEventListener("click", addPlayer);
    removeBtn.addEventListener("click", removePlayer);
    playBtn.addEventListener("click", validateAndPlay);
    modeBtn.addEventListener("click", toggleMode);
  
    // Start with 2 blank player inputs
    addPlayer();
    addPlayer();
  </script>
  
</body>
</html>
